<!doctype html>
<!--
  Source for the app icons. Render with headless Chrome (see scripts/render-icons.mjs):
  ?v=icon (iOS / web, full bleed) | fg (Android adaptive foreground) | bg (adaptive background) | mono (Android themed icon)
-->
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; width: 1024px; height: 1024px; }
  text { font-family: "Big Shoulders Display", sans-serif; font-weight: 900; }
</style>
<svg id="art" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
  // Same seeded halftone burst as the app (src/ui/Halftone.tsx), tonal on the red field.
  function mulberry32(a) { return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function halftone({ seed, focus, reach, spacing, angle, bars }, w, h) {
    const rand = mulberry32(seed), diag = Math.hypot(w, h), fx = focus[0] * w, fy = focus[1] * h;
    const a = angle * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), cx = w / 2, cy = h / 2, n = Math.ceil(diag / spacing) + 2;
    let d = "";
    for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
      const x = cx + i * spacing * ca - j * spacing * sa, y = cy + i * spacing * sa + j * spacing * ca;
      if (x < -spacing || y < -spacing || x > w + spacing || y > h + spacing) continue;
      const dist = Math.hypot(x - fx, y - fy) / (reach * diag); if (dist >= 1) continue;
      const r = spacing * 0.5 * Math.min(1, Math.pow(1 - dist, 1.7) * (0.85 + 0.3 * rand()) * 1.25); if (r <= 0.7) continue;
      d += `M${x - r} ${y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;
    }
    const toward = Math.atan2(cy - fy, cx - fx);
    for (let k = 0; k < bars; k++) {
      const off = (k - (bars - 1) / 2) * spacing * (1.6 + rand()), len = diag * (0.14 + 0.24 * rand());
      const th = spacing * [0.35, 0.6, 1.0, 1.6][Math.floor(rand() * 4)], st = (0.04 + 0.12 * rand()) * diag;
      const rot = toward + (rand() - 0.5) * 6 * Math.PI / 180, ux = Math.cos(rot), uy = Math.sin(rot), px = -uy, py = ux;
      const p = (al, ac) => `${fx + ux * al + px * ac} ${fy + uy * al + py * ac}`;
      d += `M${p(st, off - th / 2)}L${p(st + len, off - th / 2)}L${p(st + len, off + th / 2)}L${p(st, off + th / 2)}Z`;
    }
    return d;
  }
  const v = new URLSearchParams(location.search).get("v") || "icon";
  const RED = "#D9241C", DEEP = "#B01B14", PAPER = "#FFFAF6", INK = "#17110F";
  const burst = halftone({ seed: 11, focus: [1.02, -0.02], reach: 0.78, spacing: 46, angle: 152, bars: 4 }, 1024, 1024);
  // Android adaptive icons are cropped to a circle/squircle: keep the letters in the middle 66%.
  const scale = v === "icon" ? 1 : 0.7;
  const letters = (s, q) => `<g transform="translate(512 512) scale(${scale}) translate(-512 -512)">
      <text x="512" y="742" font-size="700" text-anchor="middle" letter-spacing="-18"><tspan fill="${s}">S</tspan><tspan fill="${q}">Q</tspan></text></g>`;
  const art = document.getElementById("art");
  const field = `<rect width="1024" height="1024" fill="${RED}"/><path d="${burst}" fill="${DEEP}"/>`;
  art.innerHTML =
    v === "icon" ? field + letters(PAPER, INK) :
    v === "bg" ? field :
    v === "fg" ? letters(PAPER, INK) :
    /* mono */ letters(PAPER, PAPER);
  document.fonts.ready.then(() => document.body.setAttribute("data-ready", "1"));
</script>
