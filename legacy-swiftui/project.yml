name: SideQuests
options:
  bundleIdPrefix: com.sidequests
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SideQuests:
    type: application
    platform: iOS
    sources: [SideQuests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidequests.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: SideQuests/App/Info.plist
      properties:
        CFBundleDisplayName: Side Quests
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Snap proof that you completed your side quest.
        NSLocationWhenInUseUsageDescription: Drops a pin on your route map each time you complete a quest.
        NSLocalNetworkUsageDescription: Finds friends' phones nearby so you can join the same lobby.
        NSBonjourServices: [_sidequests._tcp, _sidequests._udp]
